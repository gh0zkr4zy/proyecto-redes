name: proyecto-grupo1
topology:
  nodes:
    r1:
      kind: linux
      image: frrouting/frr:v8.2.2
    r2:
      kind: linux
      image: frrouting/frr:v8.2.2
    r3:
      kind: linux
      image: frrouting/frr:v8.2.2
    sw-a:
      kind: bridge
    sw-b:
      kind: bridge
    pc-admin:
      kind: linux
      image: ghcr.io/hellt/network-multitool
    pc-ventas:
      kind: linux
      image: ghcr.io/hellt/network-multitool
    srv-web:
      kind: linux
      image: ghcr.io/hellt/network-multitool
    srv-datos:
      kind: linux
      image: ghcr.io/hellt/network-multitool
    externo:
      kind: linux
      image: ghcr.io/hellt/network-multitool

  links:
    # Enlaces punto a punto entre routers (/30)
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
    - endpoints: ["r1:eth2", "r3:eth1"]

    # Red externa conectada a r1
    - endpoints: ["r1:eth4", "externo:eth1"]

    # Segmento Servidores en r1 vía sw-b
    - endpoints: ["r1:eth3", "sw-b:eth1"]
    - endpoints: ["sw-b:eth2", "srv-web:eth1"]
    - endpoints: ["sw-b:eth3", "srv-datos:eth1"]

    # Segmento Clientes (VLAN 10 y 20) en r2 vía sw-a
    - endpoints: ["r2:eth3", "sw-a:eth1"]
    - endpoints: ["sw-a:eth2", "pc-admin:eth1"]
    - endpoints: ["sw-a:eth3", "pc-ventas:eth1"]